<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="434" viewBox="0 0 1120 434" role="img" aria-labelledby="title desc">
  <title id="title">load_gm_to_l1 · ND → NZ</title>
  <desc id="desc">左侧 GM 按 ND 逐行存放。右侧 L1 按 NZ 分块存放，斜箭头从元素偏移 07 接到 08。首行第三列的元素从 GM 偏移 02 搬到 L1 偏移 08。</desc>
