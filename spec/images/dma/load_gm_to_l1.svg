    .note { font-size: 21px; }
    .cell { fill: #D5E8F6; stroke: #263747; stroke-width: 1.8; }
    .block-edge { fill: none; stroke: #263747; stroke-width: 3; }
    .trace { fill: none; stroke: #582877; stroke-width: 2.4; marker-mid: url(#small-head); marker-end: url(#small-head); }
    .connector { fill: none; stroke: #582877; stroke-width: 3; }
    .arrow { fill: none; stroke: #582877; stroke-width: 3; marker-end: url(#head); }
    .index { stroke: #D5E8F6; stroke-width: 4; stroke-linejoin: round; paint-order: stroke; }
  </style>
