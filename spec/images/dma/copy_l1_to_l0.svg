<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="556" viewBox="0 0 1120 556" role="img" aria-labelledby="title desc">
  <title id="title">copy_l1_to_l0 · L1 至 Cube 的矩阵输入通路</title>
  <desc id="desc">Ascend950 的 AIC 从 L1 经 MTE1 把 A 和 B 搬到 L0A 和 L0B。L0A 按 NZ 读 A 的行，L0B 按 ZN 读 B 的列。用 NZ 的 B 作源时，搬运中转置分块使 B 同一列的 K 向元素连续。</desc>
  <style>
    text { font-family: Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #263747; font-size: 26px; }
    .heading { font-weight: bold; }
    .note { font-size: 21px; }
    .frame { fill: #FFFFFF; stroke: #71818D; stroke-width: 2; }
    .cell { stroke: #263747; stroke-width: 1.8; }
    .arrow { fill: none; stroke: #582877; stroke-width: 3; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#582877"/>
    </marker>
  </defs>
  <rect width="1120" height="556" fill="#FFFFFF"/>
  <rect class="frame" x="25" y="25" width="1070" height="295"/>
  <text x="50" y="61" text-anchor="start" class="heading">Ascend950 · AIC</text>
  <rect class="cell" x="71" y="121" width="150" height="124" fill="#D5E8F6"/>
  <text x="146" y="172" text-anchor="middle">L1</text>
  <text x="146" y="207" text-anchor="middle" class="note">A、B 为 NZ</text>
  <path class="arrow" d="M221 145H432"/>
  <path class="arrow" d="M221 221H432"/>
  <text x="327" y="132" text-anchor="middle" class="note">A · MTE1</text>
  <text x="327" y="177" text-anchor="middle" class="note">is_transpose=False</text>
  <text x="327" y="205" text-anchor="middle" class="note">B · MTE1</text>
  <text x="327" y="253" text-anchor="middle" class="note">is_transpose=True</text>
  <rect class="cell" x="440" y="114" width="191" height="61" fill="#ADCFE8"/>
  <text x="535" y="151" text-anchor="middle">L0A · NZ</text>
  <rect class="cell" x="440" y="190" width="191" height="61" fill="#F8E6B8"/>
  <text x="535" y="228" text-anchor="middle">L0B · ZN</text>
  <path class="arrow" d="M631 145H740"/>
  <path class="arrow" d="M631 221H740"/>
  <text x="687" y="131" text-anchor="middle" class="note">A 的行</text>
  <text x="687" y="249" text-anchor="middle" class="note">B 的列</text>
  <rect class="cell" x="748" y="114" width="145" height="137" fill="#E1EFDE"/>
  <text x="820" y="171" text-anchor="middle">Cube</text>
  <text x="820" y="209" text-anchor="middle" class="note">A × B</text>
  <path class="arrow" d="M893 183H936"/>
  <rect class="cell" x="944" y="145" width="112" height="76" fill="#D5E8F6"/>
  <text x="1000" y="175" text-anchor="middle">L0C</text>
  <text x="1000" y="204" text-anchor="middle" class="note">C · NZ</text>
  <text x="560" y="369" text-anchor="middle" class="heading">B 分块内的连续地址顺序</text>
  <text x="302" y="415" text-anchor="middle" class="note">L1 · 块内按行</text>
  <text x="818" y="415" text-anchor="middle" class="note">L0B · 块内按列</text>
  <rect class="cell" x="146" y="431" width="78" height="45" fill="#D5E8F6"/>
  <rect class="cell" x="224" y="431" width="78" height="45" fill="#E1EFDE"/>
  <rect class="cell" x="302" y="431" width="78" height="45" fill="#D5E8F6"/>
  <rect class="cell" x="380" y="431" width="78" height="45" fill="#E1EFDE"/>
  <text x="185.0" y="462.5" text-anchor="middle">b₀₀</text>
  <text x="263.0" y="462.5" text-anchor="middle">b₀₁</text>
  <text x="341.0" y="462.5" text-anchor="middle">b₁₀</text>
  <text x="419.0" y="462.5" text-anchor="middle">b₁₁</text>
  <rect class="cell" x="662" y="431" width="78" height="45" fill="#D5E8F6"/>
  <rect class="cell" x="740" y="431" width="78" height="45" fill="#D5E8F6"/>
  <rect class="cell" x="818" y="431" width="78" height="45" fill="#E1EFDE"/>
  <rect class="cell" x="896" y="431" width="78" height="45" fill="#E1EFDE"/>
  <text x="701.0" y="462.5" text-anchor="middle">b₀₀</text>
  <text x="779.0" y="462.5" text-anchor="middle">b₁₀</text>
  <text x="857.0" y="462.5" text-anchor="middle">b₀₁</text>
  <text x="935.0" y="462.5" text-anchor="middle">b₁₁</text>
  <path class="arrow" d="M474 454H647"/>
  <text x="560" y="526" text-anchor="middle" class="note">取 16 × 16 分块的左上角为例。下标为 (k, n)，同一列的 K 向元素在 L0B 中相邻。</text>
</svg>
