<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="596" viewBox="0 0 1120 596" role="img" aria-labelledby="title desc">
  <title id="title">copy_l0c_to_ub · Fixpipe 写两个 AIV 的 UB</title>
  <desc id="desc">Ascend950 在同一个 AI Core 内，把 AIC 的 L0C 经 Fixpipe 分送到 AIV 子块 0 和子块 1 的 UB。图内分别展示列切分和行切分时各子块收到的 ND 数据。</desc>
