<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="407" viewBox="0 0 1120 407" role="img" aria-labelledby="title desc">
  <title id="title">copy_ub_to_l1 · 三行二维搬运</title>
  <desc id="desc">UB 到 L1 逐行搬运四个带编号的 32B 数据块。UB 三行的行首字节偏移为 0、160、320，L1 为 0、192、384。每行末尾的空白格在 UB 占 32B，在 L1 占 64B，构成两侧行间距的差异。</desc>
